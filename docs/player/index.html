<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nijatva Video Player</title>
<style>
  :root {
    --emerald:#10B981; --azure:#3B82F6; --cyan:#22D3EE;
    --bg:#121212; --surface:#1A1A1A; --line:#262626;
    --text:#F3F4F6; --muted:#9CA3AF;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); }
  .dot { width:26px; height:26px; border-radius:8px; background:var(--emerald);
         display:grid; place-items:center; }
  .dot::after { content:""; width:0; height:0; border-left:9px solid #fff;
                border-top:6px solid transparent; border-bottom:6px solid transparent; margin-left:2px; }
  h1 { font-size:16px; margin:0; font-weight:700; }
  main { flex:1; display:flex; min-height:0; }
  #stage { flex:1; background:#000; display:flex; align-items:center; justify-content:center; position:relative; }
  video { width:100%; height:100%; background:#000; }
  #empty { color:var(--muted); font-size:14px; text-align:center; padding:24px; }
  aside { width:280px; border-left:1px solid var(--line); background:var(--surface); overflow:auto; }
  aside h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
             margin:16px 12px 8px; }
  .item { padding:10px 12px; font-size:13px; cursor:pointer; border-left:3px solid transparent;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item:hover { background:#222; }
  .item.active { border-left-color:var(--emerald); background:#1f2a26; }
  footer { border-top:1px solid var(--line); padding:10px 16px; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; align-items:center; gap:10px; }
  input[type=range] { flex:1; accent-color:var(--emerald); }
  button { background:var(--surface); color:var(--text); border:1px solid var(--line);
           border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer; }
  button:hover { border-color:var(--emerald); }
  button.primary { background:var(--emerald); color:#00281b; border-color:var(--emerald); font-weight:600; }
  input[type=url] { flex:1; background:#0f0f0f; color:var(--text); border:1px solid var(--line);
                    border-radius:8px; padding:8px 10px; font-size:13px; }
  .time { font-variant-numeric: tabular-nums; font-size:12px; color:var(--muted); min-width:44px; text-align:center; }
  label.file { display:inline-block; }
</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>Nijatva Video Player</h1>
</header>

<main>
  <div id="stage">
    <div id="empty">Open a video file or paste a stream URL below</div>
    <video id="video" controls playsinline style="display:none"></video>
  </div>
  <aside>
    <h2>Playlist</h2>
    <div id="list"></div>
  </aside>
</main>

<footer>
  <div class="row">
    <span class="time" id="cur">00:00</span>
    <input type="range" id="seek" value="0" min="0" max="1000" step="1" />
    <span class="time" id="dur">00:00</span>
  </div>
  <div class="row">
    <button class="primary" id="play">Play</button>
    <button id="back10">-10s</button>
    <button id="fwd10">+10s</button>
    <select id="speed" style="background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px">
      <option value="0.5">0.5x</option><option value="0.75">0.75x</option>
      <option value="1" selected>1.0x</option><option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option><option value="2">2.0x</option>
    </select>
    <label class="file"><input type="file" id="file" accept="video/*" multiple hidden />
      <button id="pick">Open files…</button></label>
    <button id="full">Fullscreen</button>
  </div>
  <div class="row">
    <input type="url" id="url" placeholder="https://example.com/video.mp4" />
    <button id="open">Open URL</button>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
